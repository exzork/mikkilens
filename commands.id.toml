# Perintah suara MikkiLens (Bahasa Indonesia).
#
# Ini milikmu -- ubah sesukamu. Kalau MikkiLens sering salah dengar sebuah
# perintah, JANGAN ubah cara bicaramu: tambahkan saja kalimat yang salah
# didengar itu ke daftar `phrases`. Itu cara paling cepat memperbaikinya.
#
# Setelah menyimpan berkas ini, ucapkan "muat ulang perintah" -- tidak perlu
# menutup MikkiLens.
#
#   phrases        = daftar kalimat yang memicu perintah ini
#   confirm        = true berarti MikkiLens bertanya dulu sebelum mengerjakan
#   confirm_prompt = kalimat pertanyaannya (boleh kunci bahasa atau teks bebas)
#
# {scene}, {source}, {text}, {question} adalah "isian": bagian kalimat yang
# berubah-ubah. Nama scene dan sumber dicocokkan dengan nama asli di OBS,
# jadi "ganti ke just chatting" tetap menemukan scene "Just Chatting".

# ---------------------------------------------------------------- siaran ----

[commands.go_live]
phrases = ["mulai siaran", "mulai streaming", "mulai live", "go live", "kita mulai siaran"]

[commands.stop_stream]
phrases = ["hentikan siaran", "akhiri siaran", "stop siaran", "stop streaming", "selesai siaran"]
confirm = true
confirm_prompt = "confirm.stop_stream"

[commands.is_live]
phrases = ["apakah saya sedang siaran", "apa saya sudah live", "saya sudah live belum", "cek siaran"]

# ----------------------------------------------------------------- scene ----

[commands.switch_scene]
phrases = ["ganti ke {scene}", "pindah ke {scene}", "ganti scene ke {scene}", "buka scene {scene}"]

[commands.current_scene]
phrases = ["scene apa sekarang", "sekarang scene apa", "scene sekarang apa"]

[commands.list_scenes]
phrases = ["sebutkan scene", "daftar scene", "ada scene apa saja"]

# --------------------------------------------------------------- channel ----

# Channel di sini artinya profil OBS ditambah login YouTube sekaligus: sekali
# ganti, stream key dan chat ikut pindah, jadi siaran musik tidak nyasar ke
# channel utama.
#
# Semua kalimat di bawah menyebut kata "channel", dan itu disengaja. "Ganti ke
# musik" dan "ganti ke just chatting" terdengar sama bagi pengenalan suara,
# padahal yang satu mengganti tampilan dan yang satu memindahkan siaran.
[commands.switch_channel]
phrases = ["ganti channel ke {channel}", "pindah channel ke {channel}", "pakai channel {channel}", "siaran ke channel {channel}"]

[commands.current_channel]
phrases = ["sekarang di channel apa", "channel apa sekarang", "ini channel mana"]

[commands.list_channels]
phrases = ["sebutkan channel", "daftar channel", "ada channel apa saja"]

# ---------------------------------------------------------------- audio ----

[commands.mute_mic]
phrases = ["matikan mikrofon", "matikan mic", "mute mic", "bisukan mikrofon", "matikan suara saya"]

[commands.unmute_mic]
phrases = ["nyalakan mikrofon", "nyalakan mic", "unmute mic", "hidupkan mikrofon", "nyalakan suara saya"]

[commands.mic_status]
phrases = ["mikrofon mati atau tidak", "cek mikrofon", "status mikrofon"]

# --------------------------------------------------------------- sumber ----

[commands.show_source]
phrases = ["tampilkan {source}", "munculkan {source}"]

[commands.hide_source]
phrases = ["sembunyikan {source}", "hilangkan {source}"]

# -------------------------------------------------------------- youtube ----

[commands.set_title]
phrases = ["ganti judul jadi {text}", "ubah judul jadi {text}", "ganti judul menjadi {text}"]
confirm = true
confirm_prompt = "confirm.set_title"

[commands.get_title]
phrases = ["judulnya apa", "apa judul siaran", "judul sekarang apa"]

[commands.viewer_count]
phrases = ["berapa penontonnya", "ada berapa penonton", "jumlah penonton", "berapa yang nonton"]

# ----------------------------------------------------------------- chat ----

[commands.chat_pause]
# Perintah pendek sering salah didengar ("jeda chat" pernah terdengar sebagai
# "jidak check"), jadi sediakan juga versi yang lebih panjang -- kalimat panjang
# lebih mudah dikenali.
phrases = [
    "jeda chat",
    "jeda dulu chatnya",
    "berhenti bacakan chat",
    "jangan bacakan chat dulu",
    "pause chat",
    "stop bacakan chat",
]

[commands.chat_resume]
phrases = ["lanjutkan chat", "lanjut chat", "bacakan chat lagi", "resume chat"]

[commands.chat_skip_to_now]
phrases = ["lompat ke chat terbaru", "susul chat", "skip ke chat sekarang", "baca chat terbaru saja"]

[commands.chat_behind]
phrases = ["ketinggalan berapa chat", "berapa chat yang belum dibaca", "seberapa tertinggal"]

[commands.chat_summarize]
phrases = ["rangkum chat", "ringkas chat", "rangkuman chat"]

# ---------------------------------------------------------------- layar ----

[commands.ask_screen]
phrases = [
    "apa yang ada di layar",
    "bacakan layar",
    "lihat layar",
    "layar isinya apa",
    "{question} di layar",
]

# --------------------------------------------------------------- sistem ----

[commands.search_web]
# Mencari di internet. Modelnya sendiri tidak bisa membuka web, jadi MikkiLens
# yang mencari lalu modelnya membacakan jawabannya -- bukan daftar judul
# halaman, tapi satu kalimat yang menjawab.
phrases = ["cari {question}", "carikan {question}", "googling {question}", "cari tahu {question}", "coba cari {question}"]
answers = true

[commands.current_time]
phrases = ["jam berapa sekarang", "sekarang jam berapa", "jam berapa", "waktu sekarang"]
# Menjawab, bukan sekadar melaporkan: "berapa menit lagi sampai jam 12" perlu
# jamnya untuk dijawab, bukan minta dibacakan jamnya.
answers = true

[commands.status]
phrases = ["status", "bagaimana keadaannya", "laporan status"]

[commands.help]
phrases = ["apa saja perintahnya", "perintah apa saja", "bantuan", "aku bisa bilang apa"]

[commands.reload_commands]
phrases = ["muat ulang perintah", "reload perintah"]
