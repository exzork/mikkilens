# MikkiLens configuration.
#
# Copy this to config.toml, or run `dist\mikkilensd.exe setup`, which writes
# config.toml for you and reads every choice aloud as you make it.
#
# Every value here has a working default -- you only need to write the lines
# you want to change. An unknown key is ignored with a warning rather than
# stopping MikkiLens from starting.
#
# API keys do NOT belong in this file. They live in data/secrets.toml (written
# by the settings app) or in an environment variable, so this file stays safe
# to share when you need someone to help you troubleshoot.

[language]
output = "id"       # The language MikkiLens speaks. "id" or "en".
stt = "id"          # The language it expects you to speak. "auto" detects, but
                    # is less accurate on short commands.
chat_tts = "follow" # "follow" reads chat in the output-language voice.

[speech]
voice = ""            # Empty uses the language default (id -> id-ID-GadisNeural).
                      # The other Indonesian voice is id-ID-ArdiNeural.
rate = "+0%"          # Speed of confirmations. "+25%" is noticeably faster.

# Every volume in this file is a plain 0 to 100: a percentage of that one
# sound's own level, where 100 is untouched and 50 is half of it.
#
# Her own loudness, never the machine's. The system volume carries the game and
# whatever OBS is capturing as well, so turning her down there turns the stream
# down with her -- and it cannot be reached by voice mid-stream, which these
# can: "atur volume bicara lima puluh persen".
volume = 100          # Loudness of confirmations.
chat_voice = ""       # Empty means the same voice as above.
chat_rate = "+15%"    # Chat is usually wanted faster than system feedback.
chat_volume = 100     # Chat is often wanted quieter than confirmations, so it
                      # sits under the stream instead of over it. Try 70.

# Donations are read above the chat backlog and below the app's own voice, so
# one is heard while it is still current rather than twenty messages later.
donation_voice = ""   # Empty means the same voice as `voice` above -- not the
                      # chat voice, so a donation does not sound like chat.
                      # Set a different voice to make donations unmistakable.
donation_rate = "+0%"
donation_volume = 100

output_device = ""    # Part of the device name, e.g. "Headphones". Empty uses
                      # the Windows default -- but see the warning below.
earcon_volume = 25    # Volume of the short tones (listening, ok, error).
                      # These are the fastest thing you have for knowing what
                      # happened, so keep them audible.
confirm_timeout_s = 8.0
lead_in_ms = 300      # Silence played before a sound when the speaker has been
                      # quiet for a while. Bluetooth headphones switch the audio
                      # link off when idle and take a moment to bring it back,
                      # swallowing whatever was sent meanwhile -- which is how
                      # you lose the first word of a sentence. Raise it if the
                      # start still gets clipped; set 0 for wired speakers.

# Note: if output_device is a device OBS captures (usually the Windows
# default), your viewers will hear MikkiLens too. That is fine and expected.
# Set this to a headphones-only device if you ever want it private instead.

[audio]
input_device = ""       # Part of the microphone name. Empty uses the default.
sample_rate = 16000
vad_aggressiveness = 2  # 0-3. Higher trims silence harder and ends a command sooner.
max_utterance_s = 12.0
silence_ms = 700        # How long a pause ends a command.

[wake]
enabled = true
model = "mikkilens"   # The name of a model in data/models, without the .onnx.
                      # This one is MikkiLens's own -- trained on her name said
                      # the Indonesian way, and carried inside the program, so
                      # it is always there. The settings app lists what is
                      # installed; a name with no model behind it loads nothing
                      # and never fires, which feels exactly like a microphone
                      # that is off.
threshold = 0.8       # How sure it has to be, from 0 to 1. Chosen from a
                      # measured curve rather than guessed: at 0.8 it answers
                      # 84 of every 100 times the name is said into noise and
                      # a room, and interrupts about once every four hours of
                      # conversation it was not spoken in. At 0.6 it answers
                      # 91 times and interrupts every 40 minutes. Mid-stream,
                      # being ignored is the cheaper mistake.
                      #
                      # Raise it if it triggers while you are talking to chat;
                      # lower it if she does not answer. The settings app shows
                      # the live score beside this, which is the fastest way to
                      # tune it against your own voice and your own room.
cooldown_s = 2.0

# The wake word needs three files in data/models: onnxruntime.dll,
# melspectrogram.onnx and embedding_model.onnx. Those are downloaded once, and
# they are the same for every wake word there is. The word itself is not a
# download -- mikkilens.onnx is written out of the program on first use.
# Without the other three the wake word says so at startup and switches itself
# off; the hotkey keeps working either way, and is the more reliable trigger.

[hotkey]
enabled = true
combination = "<ctrl>+<alt>+<space>"  # A foot pedal or Stream Deck key works too.
push_to_talk = true                   # false = press once to start, once to stop.

# The key that silences the chat being read aloud, and gives it back.
#
# One press to stop the voice in your ear, one to start it again. It is a key
# rather than a spoken command because the moment you want it is a moment when
# something else needs to be heard -- a guest arrives, someone in the room asks
# you something, a song is about to start -- and saying "bisukan chat" over that
# is the opposite of the point.
#
# Nothing is thrown away while it is on. Chat piles up behind it and is read
# from where you left off once you give it back, so muting to take a phone call
# does not cost you the chat that arrived during it. Errors, questions and
# answers still speak straight through: those are about you, not about the
# stream.
#
# "bisukan chat" and "bunyikan chat lagi" do the same thing out loud.
[mute]
enabled = true
combination = "<ctrl>+<alt>+<m>"

# Finding a song, and playing it.
#
# Everything else here is spoken; the song name is typed, and deliberately.
# Song and artist names are what speech recognition is worst at -- they are not
# sentences in any language -- and a misheard one does not fail loudly, it just
# finds five wrong songs. Typing gets the spelling exactly right.
#
# Press the key, type the name, press Enter. The five results are read out one
# at a time; press 1 to 5, or say "putar nomor dua". Pressing a number while
# they are still being read stops the reading and starts the song.
#
# `combination` is watched by the MikkiLens window rather than by the engine,
# since what it opens is a window. Running the engine on its own means no box
# -- and "putar lagu monokrom", said in full, still works.
#
# The song plays inside MikkiLens, not in a browser. That is what makes
# "hentikan lagunya", "jeda lagunya" and "lagu apa ini" mean anything, and it
# is what lets the music step back on its own whenever MikkiLens speaks.
[music]
enabled = true
combination = "<ctrl>+<alt>+<f>"

# Where the song comes out. Empty means wherever the voice goes.
#
# Worth setting on a streaming machine, where the two usually want to be
# different: the voice in your headphones, the music into whatever OBS is
# capturing -- so the audience hears the song and not the chat being read to
# you. The name is matched the same way [speech] output_device is.
output_device = ""

# How loud the song is, and what it drops to while MikkiLens is talking.
#
# The ducking is the whole argument for playing music here rather than in a
# browser: a browser cannot know the chat is being read over it, so the two
# talk at once and neither can be followed. Quieter, never silent -- a song
# that vanishes whenever a message is read sounds like the music stopping.
volume = 70
duck_volume = 25

# The two programs that play a song: yt-dlp works out the audio URL, ffmpeg
# decodes it as it arrives. Nothing is downloaded to disk -- the song is
# streamed and played, and stopping it stops it.
#
# Leave both empty and MikkiLens finds them: its own copies first, then the
# PATH. Whatever is missing comes down with the first-run download, alongside
# the speech model, rather than partway through your first song -- a minute of
# waiting is fine at first launch and no use at all mid-stream. Anything already
# installed is used rather than downloaded again, which on a machine that
# already runs ffmpeg is most of it.
#
# Set these only to point at a copy kept somewhere particular. A path written
# here that is not there is an error rather than a fallback: running a
# different program than the one asked for is not something you could work out
# by ear.
# ytdlp_path = "D:/tools/yt-dlp.exe"
# ffmpeg_path = "D:/ffmpeg/bin/ffmpeg.exe"

# Keys that run one command, without a word being said.
#
# The hotkey above opens the microphone. These do not: each one runs its
# command straight away, and says what happened. That is what a Stream Deck
# key is for -- "go live" should be one press mid-sentence, not a sentence.
#
# Every device does this the same way, whatever the brand, because they all
# send an ordinary key combination: an Elgato or Loupedeck key set to Hotkey,
# a Logitech or Razer mouse macro, a foot pedal, a second keyboard, an
# AutoHotkey script. Pick combinations nothing else uses -- <ctrl>+<alt> with
# F13 to F24 is the safest, since those keys exist for exactly this and no
# keyboard has them physically.
#
# A deck that cannot send keys can run a program instead:
#     mikkilensd.exe do go_live
# Run `mikkilensd do --list` for the names.
#
#   [[bindings]]
#   combination = "<ctrl>+<alt>+<f13>"
#   command = "go_live"
#
#   [[bindings]]
#   combination = "<ctrl>+<alt>+<f14>"
#   command = "stop_stream"
#   # Ending the stream asks first, and the microphone opens by itself so you
#   # can answer "ya" or "tidak" out loud. Add confirm = false to make the key
#   # a single press -- reasonable on a key that cannot be hit by accident.
#
#   [[bindings]]
#   combination = "<ctrl>+<alt>+<f15>"
#   command = "chat_pause"

[stt]
backend = "auto"       # "auto" prefers a local whisper.cpp server, then its
                       # one-shot CLI, then base_url below. "whisperserver",
                       # "whispercpp" or "openai" force one.
model_size = "small"   # tiny / base / small / medium / large-v3-turbo.
                       #
                       # For a one-and-a-half second command, on a CPU with 8
                       # threads and on an RTX 3070:
                       #   base   0.7s CPU  / 0.1s GPU  -- misses words
                       #   small  2.2s CPU  / 0.2s GPU  -- the default
                       #   medium 6s   CPU  / 0.5s GPU  -- for long titles
                       # "small" on the processor is slow enough that you
                       # start repeating yourself, which is exactly why the
                       # GPU build below is worth the download. Memory: small
                       # is about 1 GB, and about 1.1 GB of video memory.
device = "auto"        # "auto" uses the graphics card when there is a GPU
                       # build of whisper.cpp and a driver for it, and the
                       # processor otherwise. "cuda" asks for the card and
                       # still falls back rather than leaving you deaf; "cpu"
                       # never touches it -- useful while the card is busy
                       # with the game you are streaming.
compute_type = "auto"
beam_size = 0          # 0 decides from where it runs: 5 on the graphics card,
                       # where it is free and more accurate, and 1 on the
                       # processor, where it is seconds you would spend
                       # waiting. Set a number to pin it.

# Local recognition needs a whisper.cpp build and a GGML model in data/models.
# Neither ships inside MikkiLens -- the model alone is half a gigabyte, and
# which build is right depends on the card in the machine -- so on a machine
# that has neither they are fetched on the first run, in this order:
#
#   the processor build      8 MB   something that can run at all
#   the speech model       488 MB   and now it can hear
#   the wake word files     68 MB   if [wake] enabled is on
#   the graphics build     670 MB   only where there is a driver to run it
#
# Each stage is said out loud as it starts, and each leaves the machine more
# useful than the last, so an interrupted download is never the difference
# between working and not. An interrupted one resumes rather than starting
# over, and nothing is re-fetched that is already here.
auto_install = true    # false leaves it entirely to you: MikkiLens then just
                       # reports that no recognition is set up. The right
                       # answer if you keep your own build in data/models, or
                       # if half a gigabyte arriving unasked would not be
                       # welcome on this connection.

# Putting them there yourself works exactly as before, and is what auto_install
# finds and leaves alone: whisper-server.exe (or whisper-cli.exe) and
# ggml-small.bin. Any build works, including the CUDA and Vulkan ones, so you
# can pick whichever suits your GPU without rebuilding MikkiLens. A GPU build
# found in data/models/whisper is preferred over a processor-only one in
# data/models, so both can sit there at once -- which is exactly what the
# fourth stage above sets up.
binary = ""            # Empty searches data/models and then PATH.
model_path = ""        # Empty searches data/models for ggml-<model_size>.bin.

# Or send audio to any endpoint that speaks the OpenAI transcription API:
# a local faster-whisper-server, OpenAI, or Groq.
base_url = ""          # e.g. "http://localhost:8000/v1"
model = ""             # e.g. "whisper-1"
api_key_env = "MIKKILENS_STT_KEY"

[obs]
host = "localhost"
port = 4455
password = ""          # From OBS: Tools -> WebSocket Server Settings.
                       # `mikkilensd enable-obs` copies it here for you.
mic_source = "Mic/Aux" # The exact name of your microphone source in OBS.
auto_connect = true
reconnect_max_s = 30.0

[youtube]
enabled = true
transport = "auto"     # How live chat is read.
                       #   "auto"   the public chat page first -- no key, no
                       #            sign-in, no quota -- then the Data API's
                       #            streaming endpoint, then polling.
                       #   "page"   the public page only.
                       #   "api"    the Data API only, if the page is not to be
                       #            relied on.
                       #   "stream" / "poll" pin one Data API transport.
                       # Polling uses far more of the daily quota than anything
                       # else here; the page uses none at all.
quota_budget = 10000
quota_warn_percent = 80

# Nothing about connecting is configured here, because nothing about it is
# typed. Open the settings app, press Connect YouTube, agree in the browser
# page that opens, and that is the whole of it. Press Disconnect to undo it;
# the sign-in is removed from this machine.
#
# Reading live chat needs even less than that: it comes from the same public
# page OBS shows in its chat dock, so it works with no sign-in at all. What
# connecting buys is the viewer count, the stream title, and changing the title
# by voice.
#
# The one thing to know: MikkiLens ships no Google credential and never will.
# A secret in a public source tree is scraped within hours, and Google revokes
# the client rather than the copy that leaked -- which would break the sign-in
# for everyone at once, mid-stream. So the OAuth client is yours: download
# desktop credentials from console.cloud.google.com with "YouTube Data API v3"
# enabled, and save the JSON as data/client_secret.json. The settings page says
# so plainly when it is missing, rather than offering a button that can only
# fail.

# More than one channel
# ---------------------
#
# A channel here is a pairing: one OBS profile, which holds that channel's
# stream key, and one YouTube sign-in, which reads that channel's chat and
# carries its title. Switching moves both at once. Moving only one is the
# failure this exists to prevent -- switching only OBS puts the music review
# out on the main channel, and switching only the sign-in reads the wrong
# chat aloud over a broadcast going somewhere else.
#
# Set one profile up per channel in OBS itself (Profile menu, New), each with
# its own stream key, and give each an obs_profile line below. Scene
# collections are optional: leave obs_scene_collection empty when both channels
# share one set of scenes and only the stream key differs.
#
# channel_id is filled in for you by connecting -- it is YouTube's own id for
# the channel and not something to type. Press "Connect another channel" in the
# settings app once per channel, choosing a different channel in the browser
# each time, and the entry appears here.
#
# Then, by voice: "ganti channel ke musik" / "switch channel to music".
#
# OBS will not change profile while you are live, so switching says so and does
# nothing rather than half-moving. End the stream first.
#
# active remembers where you were, so opening MikkiLens puts you back on the
# same channel. It is rewritten on every switch.

# active = "UC..."

# [[youtube.channels]]
# name = "main"                       # what you say to switch to it
# channel_id = "UC..."                # filled in by connecting
# obs_profile = "Main"                # the OBS profile holding its stream key
# obs_scene_collection = "Main"       # optional

# [[youtube.channels]]
# name = "music"
# channel_id = "UC..."
# obs_profile = "Music Review"
# obs_scene_collection = "Music Review"

[chat]
enabled = true
autostart_reading = true
translate = false            # Translate chat before reading. Slower, costs money.
skip_emote_only = true
collapse_duplicates = true
read_superchats_first = true
max_message_chars = 200      # Longer messages are cut off.
muted_users = []             # Names here are never read aloud.
max_gift_recipients = 5      # When somebody gifts memberships in bulk, YouTube
                             # sends one message per recipient. Read this many
                             # names, then "and 45 others" once. 0 reads all.

[tako]
# Donations, so chat is not read over the top of them.
#
# Tako's alert overlay is a browser source in OBS: it shows the alert and reads
# the donation out in its own voice. Nothing tells MikkiLens that is happening,
# so without this she talks straight through every donation -- the one message
# on your stream somebody paid to be heard.
#
# MikkiLens only listens. It never tells Tako an alert has been played: that is
# what moves Tako's queue on, and it belongs to the browser source in OBS. If
# MikkiLens claimed it, donations would stop appearing on your stream.
enabled = false

# The overlay_key from the alert overlay link in your Tako dashboard. It is the
# part after "overlay_key=" in
#     https://tako.id/overlay/alert?overlay_key=XXXXXXXX
#
# Anyone holding it can read your donations as they arrive. Leave it empty here
# and put it in the environment variable below, or in data/secrets.toml, if you
# would rather this file stayed safe to hand to someone for help.
# Paste the whole link; the key alone still works for configs written before
# links were accepted.
link = ""
overlay_key = ""
overlay_key_env = "MIKKILENS_TAKO_OVERLAY_KEY"

# Read the donation out in her voice instead of the overlay's.
#
# IMPORTANT: switch the overlay's own voice off in the site's dashboard when you
# turn this on, or every donation is read twice at once. The reason to do it
# here is that it uses her voice, her language and her output device, and it
# queues with everything else she says rather than cutting across it.
read_aloud = false

# How long to stay quiet is taken from the alert duration you set in Tako, so
# changing it there changes it here. These three adjust around that number.
extra_seconds = 2.0        # Added to every alert. Chat starting again on the
                           # exact frame the alert leaves sounds like an
                           # interruption.
max_hold_s = 90.0          # The ceiling on one alert, whatever Tako says. Chat
                           # going quiet for the rest of a stream because a
                           # number came back wrong is the failure this rules
                           # out.
tts_chars_per_second = 14.0 # An alert stays up until Tako has finished reading
                           # the message, not for its set duration, so a long
                           # donation needs longer. Raise this if chat comes
                           # back too late, lower it if it comes back over the
                           # tail of a long message.


[trakteer]
# The other donation overlay, for the same reason as [tako] above: so chat is
# not read over the top of an alert.
#
# A Trakteer donation arrives whole rather than as a nudge to go and fetch it,
# so there is no queue to race and nothing to acknowledge. The only thing read
# over HTTP is how long you have set an alert to stay up.
enabled = false

# The whole notification overlay address from your Trakteer dashboard. Both
# halves of it are needed -- the key and the hash -- so paste the entire link
# rather than picking it apart:
#     https://stream.trakteer.id/notification/index.html?key=trstream-XXXX&unit=Cendol&mod=3&hash=YYYY
#
# Anyone holding it can read your donations as they arrive, so it can be left
# empty here and put in the environment variable below, or in data/secrets.toml.
link = ""
link_env = "MIKKILENS_TRAKTEER_LINK"

# Read the donation out in her voice instead of the overlay's.
#
# IMPORTANT: switch the overlay's own voice off in the site's dashboard when you
# turn this on, or every donation is read twice at once. The reason to do it
# here is that it uses her voice, her language and her output device, and it
# queues with everything else she says rather than cutting across it.
read_aloud = false

# How long to stay quiet comes from the alert duration set in your Trakteer
# dashboard, so changing it there changes it here. A voice note or a shared
# video runs for its own length instead, and those scale with how many units
# were given -- ten Cendol is a much longer alert than one.
extra_seconds = 2.0
max_hold_s = 90.0
tts_chars_per_second = 14.0   # Only used when you have Trakteer's own
                              # text-to-speech switched on.

[model]
# The one model MikkiLens talks to. Any OpenAI-compatible endpoint, for example:
#     https://api.openai.com/v1
#     https://api.z.ai/api/paas/v4
#     https://openrouter.ai/api/v1
#     http://localhost:11434/v1   (Ollama, on your own machine, free)
#
# It answers everything: summarising chat, working out a command none of your
# written phrases matched, and describing what is on screen. There used to be
# three sections here, one per job, which meant three places to paste a key
# into and three ways to have pasted it wrong -- for a distinction nobody was
# actually making.
#
# Which does mean the model has to be one that can see. Pick a multimodal one:
# gpt-4o-mini, glm-4.6v, gemma3:12b, llava. Press "Test the model" in the
# settings app -- the test sends a real image, so a text-only model fails there
# rather than the first time you ask about your screen mid-stream.
base_url = ""
model = ""                   # e.g. "gpt-4o-mini", "glm-4.6v", "llava"
api_key_env = "MIKKILENS_MODEL_KEY"
timeout_s = 30.0

[vision]
# How the screen is captured before it is sent. Which model looks at it is
# [model] above.
max_edge = 1568              # Screenshots are downscaled to this before sending.
monitors = "all"             # "all", "primary", or a monitor number.
max_answer_chars = 700       # Keeps spoken answers from running on forever.

[matcher]
# What to do when your words do not match any written phrase -- where MikkiLens
# would otherwise just say "saya tidak tahu perintah itu".
#
# With this on, an unmatched utterance is sent to the model in [model] and it
# is asked which command you meant. Everything that already matches keeps
# working exactly as before and stays instant; only the misses cost about a
# second, and only the misses are ever sent anywhere.
#
# The commands are handed over as tools, the same shape a model is given any
# other tool, each one described by the phrases you wrote for it and declaring
# the values it takes. That is what keeps the answer honest: the provider
# constrains it to a command that exists and to values that were declared,
# rather than the model being asked for JSON and hoping.
#
# An endpoint too old or too small for tool calling is not left out -- it is
# asked the older way, in the prompt, and remembered so the attempt is not
# repeated on every utterance.
#
# A command marked `answers` in commands.toml is treated differently: it is run,
# and its result is given back to the model to answer from. "Berapa menit lagi
# sampai jam 12" needs the time to answer but is not a request to be told the
# time, and "cari harga bitcoin" needs a search whose results are page titles
# rather than an answer. The reply is spoken a sentence at a time as it is
# written, so it starts before the model has finished.
#
# Only commands that report are marked that way. Handing "the microphone is
# off" back to a model to comment on would add a round trip to a command that
# had already finished.
#
# The model is only ever allowed to pick a command that exists, and a command
# marked confirm still asks before it acts -- so a wrong guess costs a
# question, not a stopped stream. It is free to pick nothing, which is what it
# is told to do when unsure, and MikkiLens then answers exactly as before.
#
# Switch it off if you would rather nothing you say leaves the machine unless
# you asked a question outright. Pointing [model] at a local Ollama is the
# other way to have both.
enabled = true

[ui]
host = "127.0.0.1"
port = 8760
open_on_start = false
lan_access = false   # true also lets other devices on your network reach the
                     # settings API, which is how someone can help remotely.
                     # It can mute your microphone and end your stream, so it
                     # is off unless you turn it on.
