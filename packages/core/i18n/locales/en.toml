# English strings. Key set must stay identical to id.toml — tests enforce this.

[meta]
name = "English"
code = "en"
voice = "en-US-AriaNeural"
yes = ["yes", "yeah", "yep", "ok", "okay", "correct", "go ahead"]
no = ["no", "nope", "cancel", "stop", "don't"]
# The positions in a spoken list, first to last. Recognition writes "two" about
# as often as it writes "2", so "play number two" has to understand both.
numbers = ["one", "two", "three", "four", "five"]

[app]
ready = "MikkiLens ready."
starting = "MikkiLens is starting."
shutdown = "MikkiLens shutting down."
restarted = "MikkiLens restarted."
ui_ready = "Settings page open at {url}"

[assets]
# The first-run download. A progress bar says nothing out loud, so the size is said
# up front -- "half a gigabyte" is the number that decides whether now is a
# good moment, and it is useless after the download has already started.
starting = "There are some things to download before MikkiLens can hear you, about {size}. This happens once. You can carry on using everything else while it runs."
stage_starting = "Downloading {what}, about {size}."
can_hear = "The speech model is ready. MikkiLens can hear you now."
failed = "Could not download {what}: {reason}. It will try again next time MikkiLens starts, and pick up where it left off."
stage_engine = "the speech recognition engine"
stage_model = "the speech model"
stage_wake = "the wake word files"
stage_gpu = "the graphics card build, which answers far faster"
stage_player = "the music downloader"
stage_ffmpeg = "the audio decoder"

[status]
live = "You are live."
not_live = "Not streaming."
scene = "Current scene is {scene}."
mic_muted = "Microphone is muted."
mic_live = "Microphone is live."
viewers = "{count} viewers."
chat_backlog = "{count} chat messages waiting."
chat_empty = "No chat messages waiting."
chat_muted = "Chat is muted."
summary = "{live} {scene} {mic} {viewers} {chat}"

[obs]
connected = "OBS connected."
disconnected = "OBS disconnected. Reconnecting."
reconnected = "OBS reconnected."
not_responding = "OBS is not responding."
mic_muted = "Microphone muted."
mic_unmuted = "Microphone unmuted."
stream_started = "You are live."
stream_stopped = "Stream stopped."
already_live = "You are already live."
not_streaming = "You are not streaming."

[confirm]
stop_stream = "Stop the stream? Say yes or no."
end_broadcast = "End the YouTube broadcast? Say yes or no."
set_title = "Change the title to {text}? Say yes or no."
timeout = "No answer. Cancelled."
cancelled = "Cancelled."
not_understood = "I did not understand. Say yes or no."

[listen]
heard = "I heard: {text}"
unknown_command = "I heard {text}, but I do not know that command."
no_speech = "I did not hear anything."
ambiguous = "The phrase {phrase} matches more than one command."

[chat]
paused = "Chat reading paused."
resumed = "Chat reading resumed."
already_paused = "Chat is already paused."
already_playing = "Chat is already being read."
# The mute key. Nothing is thrown away while it is on, which is the part worth
# saying: what stops is the reading, not the listening.
muted = "Chat muted."
unmuted = "Chat unmuted."
skipped = "Skipped {count} messages. You are up to date."
behind = "You are {count} messages behind, about {minutes} minutes."
up_to_date = "Chat is up to date."
message = "{author} says: {text}"
superchat = "Super chat from {author}, {amount}. {text}"
member = "{author} just became a member."
member_level = "{author} just became a {level} member."
member_upgraded = "{author} upgraded to {level}."
member_months = "{author} has been a member for {months} months. {text}"
member_months_level = "{author} has been a {level} member for {months} months. {text}"
gift = "{author} gifted {count} memberships."
gift_level = "{author} gifted {count} {level} memberships."
gift_received = "{author} received a gift membership from {gifter}."
gift_received_unknown = "{author} received a gift membership."
gift_others = "And {count} others received one too."
connected = "YouTube chat connected."
disconnected = "YouTube chat disconnected. Reconnecting."
unavailable = "This broadcast does not have live chat switched on, so there is nothing to read. I will keep checking."
summarizing = "Summarizing chat."
summary = "Chat summary: {text}"
quota_warning = "YouTube quota is {percent} percent used. Slowing chat down."

[tako]
unreachable = "I cannot reach the Tako donation overlay, so I will not know to go quiet when a donation comes in. Check the overlay link on the settings page."
donation = "Donation from {donor}, {amount}. {text}"
donation_no_message = "Donation from {donor}, {amount}."

[trakteer]
unreachable = "I cannot reach the Trakteer donation overlay, so I will not know to go quiet when a donation comes in. Check the overlay link on the settings page."
donation = "{donor} gave {count} {unit}, {price}. {text}"
donation_no_message = "{donor} gave {count} {unit}, {price}."

[clock]
# Twenty-four hour: it matches the schedule and the broadcast tools, and it
# cannot be the wrong half of the day the way "2:35" can.
now = "It is {time}."

[search]
# Read by the model rather than by her, except when a search phrase matched
# outright and the results are relayed as they are.
nothing_asked = "I did not catch what to search for."
failed = "I could not reach the search just now."
nothing_found = "I could not find anything about {question}."

[music]
# Finding a song and playing it. The name is typed rather than spoken, because
# song and artist names are what speech recognition is worst at; {key} is the
# key that opens the box to type it in.
nothing_asked = "Say the song after the command, or press {key} to type it."
# The box is open and waiting. Said rather than shown, because the box is the
# one thing here she is not meant to have to look at.
type_it = "Type the song, then press Enter."
searching = "Searching for {query}."
failed = "I could not reach YouTube Music just now."
nothing_found = "I could not find anything for {query}."
found = "{count} songs."
# One result. Read one at a time, so each is a sentence rather than an item.
result = "{number}. {title}, {artist}."
result_timed = "{number}. {title}, {artist}, {minutes} minutes {seconds}."
pick = "Say play number one to {count}."
playing = "Playing {title} by {artist}."
# Playing it here rather than handing it to a browser, so it can be stopped,
# paused, and stepped back whenever MikkiLens speaks.
playing_is = "{title} by {artist} is playing."
paused_is = "{title} by {artist} is paused."
nothing_playing = "Nothing is playing."
stopped = "Music stopped."
# From the top. The title is said because this doubles as the answer to
# "did that actually start again".
restarted = "{title}, from the start."
paused = "Music paused."
already_paused = "The music is already paused."
resumed = "Music playing again."
already_playing = "The music is already playing."
play_failed = "I could not play {title}."
# The first song on a new machine fetches the two programs that play it. Said
# out loud, because it is the one time this takes minutes rather than seconds.
installing = "Getting what I need to play music, about {size}. This happens once."
installed = "Ready to play music."
install_failed = "I could not set up music playback: {reason}"
tools_busy = "Something else is still downloading. Ask again in a minute."
no_tools = "The music programs are not where the settings say they are."
nothing_to_play = "There are no search results to play. Search for a song first."
no_such_result = "There is no number {number}. There are {count}."
not_a_number = "I did not catch which number: {number}."

[volume]
# The answer to "set the speaking volume to fifty percent" and its neighbours.
# Every one of these is spoken at the volume it is reporting, so if the answer
# cannot be heard, that is the answer.
speech = "Speaking volume {percent} percent."
chat = "Chat reading volume {percent} percent."
earcon = "Tone volume {percent} percent."
music = "Music volume {percent} percent."
not_a_number = "I did not catch the number: {amount}. Say zero to a hundred percent."
failed = "The volume could not be changed: {reason}"
not_saved = "The volume has changed, but it could not be saved: {reason}"

[vision]
looking = "Looking at your screen."
failed = "Could not read the screen: {reason}"
no_provider = "The model is not set up yet. Open the settings page and fill in the model endpoint."

[youtube]
connected = "YouTube connected as {channel}."
needs_sign_in = "That needs YouTube connected. Open the settings page and press Connect YouTube."
not_connected = "YouTube is not connected. Open the settings page and press Connect YouTube."
sign_in_expired = "The YouTube sign-in is no longer accepted. Open the settings page and press Connect YouTube again."
no_broadcast = "There is no active broadcast."
title_changed = "Title changed to {text}."
title_is = "The current title is: {text}"

[channel]
switched = "Now on {channel}."
followed = "OBS switched profile. Now on {channel}."
already = "Already on {channel}."
current = "You are on {channel}."
list = "Your channels: {channels}."
not_found = "I could not find a channel called {channel}."
none = "No channels are set up yet. Open the settings page and connect one."
not_connected = "{channel} is not connected. Open the settings page and connect it."
sign_in_expired = "The {channel} sign-in has expired. Open the settings page and connect it again."
live = "You are live. Stop the stream before switching to {channel}."
busy = "OBS is still loading scenes. Try again in a moment."
no_profile = "{channel} does not have an OBS profile set yet."
loading_scenes = "Loading the {channel} scenes."
obs_failed = "Could not switch OBS: {reason}"



[commands]
reloaded = "Commands reloaded. {count} commands available."
reload_failed = "Could not reload commands: {reason}"
help_intro = "Here is what you can say:"
help_item = "{phrase}"

[wizard]
welcome = "Welcome to MikkiLens. I will guide you through setup by voice."
output_intro = "I will now play a test tone through each output device in turn."
output_device = "Device number {index}. {name}. This is what it sounds like."
output_chosen = "Good. MikkiLens will speak through {name}."
output_warning = "Note: OBS captures this device, so viewers will hear me too. That is fine."
input_intro = "Now the microphone. Please say something after the tone."
input_ok = "The microphone sounds good."
input_silent = "I did not hear anything from that microphone."
selftest_intro = "Checking everything."
selftest_ok = "{item} is fine."
selftest_fail = "{item} has a problem: {reason}"
done = "Setup complete."

[error]
generic = "Something went wrong: {reason}"
not_available = "The command {command} is not available yet."
no_audio_device = "No audio device found."
mic_lost = "The microphone was disconnected."
network = "There is a network problem."
config_invalid = "The configuration file is invalid: {reason}"
