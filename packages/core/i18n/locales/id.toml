# dikatakan: yang berhenti pembacaannya, bukan penerimaannya.
muted = "Chat dibisukan."
unmuted = "Chat dibunyikan lagi."
skipped = "Melompati {count} chat. Sekarang sudah paling baru."
behind = "Kamu tertinggal {count} chat, sekitar {minutes} menit."
up_to_date = "Chat sudah paling baru."
message = "{author} bilang: {text}"
superchat = "Super chat dari {author}, {amount}. {text}"
member = "{author} baru saja menjadi member."
member_level = "{author} baru saja menjadi member {level}."
member_upgraded = "{author} naik ke level {level}."
member_months = "{author} sudah menjadi member selama {months} bulan. {text}"
member_months_level = "{author} sudah menjadi member {level} selama {months} bulan. {text}"
gift = "{author} menghadiahkan {count} membership."
gift_level = "{author} menghadiahkan {count} membership {level}."
gift_received = "{author} mendapat hadiah membership dari {gifter}."
gift_received_unknown = "{author} mendapat hadiah membership."
gift_others = "Dan {count} orang lainnya juga mendapatkannya."
connected = "Chat YouTube tersambung."
disconnected = "Chat YouTube terputus. Mencoba menyambung lagi."
unavailable = "Siaran ini tidak mengaktifkan live chat, jadi tidak ada yang bisa dibacakan. Saya akan terus memeriksa."
summarizing = "Sedang merangkum chat."
summary = "Ringkasan chat: {text}"
quota_warning = "Kuota YouTube sudah terpakai {percent} persen. Pembacaan chat diperlambat."

[tako]
unreachable = "Saya tidak bisa menghubungi overlay donasi Tako, jadi saya tidak akan tahu harus diam saat ada donasi. Periksa tautan overlay di halaman pengaturan."
donation = "Donasi dari {donor}, {amount}. {text}"
donation_no_message = "Donasi dari {donor}, {amount}."

[trakteer]
unreachable = "Saya tidak bisa menghubungi overlay donasi Trakteer, jadi saya tidak akan tahu harus diam saat ada donasi. Periksa tautan overlay di halaman pengaturan."
donation = "{donor} memberi {count} {unit}, {price}. {text}"
donation_no_message = "{donor} memberi {count} {unit}, {price}."

[clock]
# Dua puluh empat jam: sama seperti jadwal dan alat siaran, dan tidak bisa
# tertukar pagi atau sore seperti "2:35".
now = "Sekarang jam {time}."

[search]
# Dibaca oleh model, kecuali kalau frasa pencarian yang cocok langsung dan
# hasilnya dibacakan apa adanya.
nothing_asked = "Saya tidak menangkap apa yang harus dicari."
failed = "Saya tidak bisa menghubungi pencarian sekarang."
nothing_found = "Saya tidak menemukan apa pun tentang {question}."

[music]
# Mencari lagu lalu memutarnya. Judulnya diketik, bukan diucapkan, karena nama
# lagu dan penyanyi adalah hal yang paling sering salah didengar; {key} adalah
# tombol yang membuka kotak ketiknya.
nothing_asked = "Sebutkan judulnya sesudah perintahnya, atau tekan {key} untuk mengetiknya."
# Kotaknya sudah terbuka dan menunggu. Dikatakan, bukan ditampilkan: kotak ini
# justru satu-satunya yang tidak perlu dilihat.
type_it = "Ketik judul lagunya, lalu tekan Enter."
searching = "Mencari {query}."
failed = "Saya tidak bisa menghubungi YouTube Music sekarang."
nothing_found = "Saya tidak menemukan apa pun untuk {query}."
found = "Ada {count} lagu."
# Satu hasil. Dibacakan satu per satu, jadi tiap hasil satu kalimat utuh.
result = "{number}. {title}, {artist}."
result_timed = "{number}. {title}, {artist}, {minutes} menit {seconds}."
pick = "Sebutkan putar nomor satu sampai {count}."
playing = "Memutar {title} dari {artist}."
# Diputar di dalam MikkiLens, bukan diserahkan ke peramban, supaya bisa
# dihentikan, dijeda, dan otomatis mengecil saat MikkiLens bicara.
playing_is = "Sedang memutar {title} dari {artist}."
paused_is = "{title} dari {artist} sedang dijeda."
nothing_playing = "Tidak ada lagu yang diputar."
stopped = "Lagunya dihentikan."
# Diulang dari awal. Judulnya disebut karena kalimat ini juga jadi jawaban
# "yang barusan itu jadi diulang atau tidak".
restarted = "Mengulang {title} dari awal."
paused = "Lagunya dijeda."
already_paused = "Lagunya memang sedang dijeda."
resumed = "Lagunya dilanjutkan."
already_playing = "Lagunya memang sedang diputar."
play_failed = "Saya tidak bisa memutar {title}."
# Lagu pertama di komputer baru mengunduh dua program pemutarnya. Dikatakan,
# karena ini satu-satunya saat yang makan menit, bukan detik.
installing = "Mengunduh yang diperlukan untuk memutar musik, sekitar {size}. Ini cuma sekali."
installed = "Siap memutar musik."
install_failed = "Gagal menyiapkan pemutar musik: {reason}"
tools_busy = "Masih ada unduhan lain yang jalan. Coba lagi sebentar."
no_tools = "Program pemutarnya tidak ada di tempat yang ditulis di pengaturan."
nothing_to_play = "Belum ada hasil pencarian untuk diputar. Cari lagunya dulu."
no_such_result = "Tidak ada nomor {number}. Hasilnya ada {count}."
not_a_number = "Saya tidak menangkap nomornya: {number}."

