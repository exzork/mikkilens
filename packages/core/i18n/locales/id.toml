# Bahasa Indonesia — bahasa keluaran bawaan MikkiLens.
# Setiap kalimat yang diucapkan MikkiLens ada di sini. Ubah sesuka hati;
# yang penting nama kuncinya (di kiri) jangan diganti.

[meta]
name = "Bahasa Indonesia"
code = "id"
voice = "id-ID-GadisNeural"
yes = ["ya", "iya", "oke", "ok", "benar", "betul", "lanjut"]
no = ["tidak", "ga", "gak", "nggak", "enggak", "batal", "jangan"]
# Urutan dalam daftar yang dibacakan. Pengenalan suara menulis "dua" sesering
# ia menulis "2", jadi "putar nomor dua" harus mengerti keduanya.
numbers = ["satu", "dua", "tiga", "empat", "lima"]

[app]
ready = "MikkiLens siap."
starting = "MikkiLens sedang dimulai."
shutdown = "MikkiLens dimatikan."
restarted = "MikkiLens dimulai ulang."
ui_ready = "Halaman pengaturan terbuka di alamat {url}"

[assets]
# The first-run download. A progress bar says nothing out loud, so the size is said
# up front -- "half a gigabyte" is the number that decides whether now is a
# good moment, and it is useless after the download has already started.
starting = "Ada yang perlu diunduh dulu supaya MikkiLens bisa mendengar, sekitar {size}. Ini cuma sekali. Kamu bisa tetap memakai yang lain sambil menunggu."
stage_starting = "Mengunduh {what}, sekitar {size}."
can_hear = "Model suaranya sudah siap. Sekarang MikkiLens sudah bisa mendengarmu."
failed = "Gagal mengunduh {what}: {reason}. MikkiLens akan mencoba lagi saat dijalankan berikutnya, dan melanjutkan dari yang sudah terunduh."
stage_engine = "mesin pengenalan suara"
stage_model = "model suaranya"
stage_wake = "berkas kata pemicu"
stage_gpu = "versi kartu grafis, supaya dia menjawab jauh lebih cepat"
stage_player = "pengunduh musiknya"
stage_ffmpeg = "pengurai audionya"

[status]
live = "Kamu sedang siaran."
not_live = "Belum siaran."
scene = "Scene sekarang {scene}."
mic_muted = "Mikrofon mati."
mic_live = "Mikrofon menyala."
viewers = "Penonton {count} orang."
chat_backlog = "Ada {count} chat yang belum dibacakan."
chat_empty = "Tidak ada chat yang tertunda."
chat_muted = "Chat sedang dibisukan."
summary = "{live} {scene} {mic} {viewers} {chat}"

[obs]
connected = "OBS terhubung."
disconnected = "OBS terputus. Mencoba menyambung lagi."
reconnected = "OBS tersambung kembali."
not_responding = "OBS tidak merespons."
scene_switched = "Pindah ke {scene}."
scene_not_found = "Tidak menemukan scene {scene}."
scene_list = "Scene yang tersedia: {scenes}."
mic_muted = "Mikrofon dimatikan."
mic_unmuted = "Mikrofon dinyalakan."
source_shown = "{source} ditampilkan."
source_hidden = "{source} disembunyikan."
source_not_found = "Tidak menemukan sumber {source}."
stream_started = "Kamu sudah live."
stream_stopped = "Siaran dihentikan."
already_live = "Kamu memang sudah siaran."
not_streaming = "Kamu memang belum siaran."

[confirm]
stop_stream = "Hentikan siaran? Jawab ya atau tidak."
end_broadcast = "Akhiri siaran di YouTube? Jawab ya atau tidak."
set_title = "Ganti judul menjadi {text}? Jawab ya atau tidak."
timeout = "Tidak ada jawaban. Dibatalkan."
cancelled = "Dibatalkan."
not_understood = "Aku tidak paham. Jawab ya atau tidak."

[listen]
heard = "Saya mendengar: {text}"
