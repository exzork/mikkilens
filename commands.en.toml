# MikkiLens voice commands (English).
#
# This file is yours to edit. If a command is often misheard, do NOT change the
# way you speak -- add the misheard text as another phrase. That is the fastest
# fix. After saving, say "reload my commands".
#
# {scene}, {source}, {text} and {question} are slots: the part that varies.
# Scene and source names are matched against what OBS actually has.
#
# Note: short two-word commands are recognised less reliably than longer ones.

# ---------------------------------------------------------------- stream ----

[commands.go_live]
phrases = ["go live", "start streaming", "start the stream", "we are going live"]

[commands.stop_stream]
phrases = ["stop the stream", "end the stream", "stop streaming", "we are done streaming"]
confirm = true
confirm_prompt = "confirm.stop_stream"

[commands.is_live]
phrases = ["am i live", "am i streaming", "are we live right now"]

# ----------------------------------------------------------------- scene ----

[commands.switch_scene]
phrases = ["switch to {scene}", "go to {scene}", "change scene to {scene}", "open scene {scene}"]

[commands.current_scene]
phrases = ["what scene am i on", "which scene is this", "what is the current scene"]

[commands.list_scenes]
phrases = ["list my scenes", "what scenes do i have", "name my scenes"]

# --------------------------------------------------------------- channel ----

# A channel is an OBS profile and a YouTube sign-in together: switching moves
# the stream key and the chat at the same time, so a music review does not go
# out on the main channel.
#
# Every phrase here says the word "channel" on purpose. "Switch to music" and
# "switch to just chatting" are the same sentence to speech recognition, and
# the two mean completely different things -- one changes what is on screen,
# the other changes where the stream is going.
[commands.switch_channel]
phrases = ["switch channel to {channel}", "change channel to {channel}", "stream to my {channel} channel", "use my {channel} channel"]

[commands.current_channel]
phrases = ["which channel am i on", "what channel is this", "which channel am i streaming to"]

[commands.list_channels]
phrases = ["list my channels", "what channels do i have", "name my channels"]

# ----------------------------------------------------------------- audio ----

# "mute X" and "unmute X" differ by two letters, which speech recognition can
# and does confuse -- and getting it backwards on a live stream is exactly the
# mistake that gives you nothing to notice. So the alternates below are deliberately
# distinct words rather than near-identical ones. (Indonesian avoids this
# naturally: "matikan" and "nyalakan" share almost nothing.)
[commands.mute_mic]
phrases = ["mute my mic", "mic off", "silence my mic", "cut my audio"]

[commands.unmute_mic]
phrases = ["unmute my mic", "mic back on", "turn my mic on", "restore my audio"]

[commands.mic_status]
phrases = ["is my mic muted", "check my microphone", "microphone status"]

# ---------------------------------------------------------------- volume ----

# Zero to a hundred, said however it comes out: "fifty percent", "fifty", or
# "50". This is how loud MikkiLens herself is, not how loud Windows is -- the
# system volume carries the game and whatever OBS is capturing too, so turning
# her down there turns the stream down with her.
#
# Each of these answers by saying the new volume at the new volume. If the
# answer cannot be heard, it is too quiet.
[commands.set_speech_volume]
phrases = ["set the speaking volume to {amount}", "set your volume to {amount}", "speaking volume {amount}"]

[commands.set_chat_volume]
phrases = ["set the chat volume to {amount}", "set the chat reading volume to {amount}", "chat volume {amount}"]

# The tones are the short sounds: listening, done, failed.
[commands.set_earcon_volume]
phrases = ["set the tone volume to {amount}", "set the tones to {amount}", "tone volume {amount}"]

[commands.set_music_volume]
phrases = ["set the music volume to {amount}", "set the song volume to {amount}", "music volume {amount}"]

# --------------------------------------------------------------- sources ----

[commands.show_source]
phrases = ["show {source}", "bring up {source}"]

[commands.hide_source]
phrases = ["hide {source}", "remove {source}"]

# --------------------------------------------------------------- youtube ----

[commands.set_title]
phrases = ["set my title to {text}", "change the title to {text}", "rename the stream to {text}"]
confirm = true
confirm_prompt = "confirm.set_title"

[commands.get_title]
phrases = ["what is my title", "what is the stream title", "read my title"]

[commands.viewer_count]
phrases = ["how many viewers", "how many people are watching", "viewer count"]

# ------------------------------------------------------------------ chat ----

[commands.chat_pause]
phrases = [
    "pause the chat",
    "pause chat reading",
    "stop reading my chat",
    "do not read the chat for now",
]

[commands.chat_resume]
phrases = ["resume the chat", "resume chat reading", "start reading my chat again"]

[commands.chat_skip_to_now]
phrases = ["skip to now", "catch up to live", "jump to the newest chat", "skip the backlog"]

[commands.chat_behind]
phrases = ["how far behind am i", "how many messages did i miss", "how much chat is waiting"]

[commands.chat_summarize]
phrases = ["summarise my chat", "summarize my chat", "give me a chat summary"]


# Silencing the chat for a moment, without stopping it being read.
#
# The key is what you normally use (Ctrl+Alt+M by default), because the moment
# you want this is a moment when something else needs to be heard -- and saying
# a sentence over that is the opposite of the point.
#
# Nothing is lost while it is muted: chat piles up behind it and is read once
# you give it back.
#
# "Mute the chat" and "unmute the chat" differ by two letters, and getting that
# backwards leaves the chat silent with nothing to notice -- the same trap the
# microphone commands above avoid, and avoided the same way: the alternates are
# deliberately different words rather than near-identical ones.
[commands.chat_mute]
phrases = ["mute the chat", "silence the chat", "chat off for a moment"]

[commands.chat_unmute]
phrases = ["let the chat talk again", "give the chat its voice back", "chat sound back on"]

# ---------------------------------------------------------------- screen ----

[commands.ask_screen]
phrases = [
    "what is on my screen",
    "read my screen",
    "describe my screen",
    "look at my screen",
    "{question} on screen",
]

# ---------------------------------------------------------------- system ----

[commands.search_web]
# Searching the web. The model has no live access of its own, so MikkiLens does
# the looking and the model says the one sentence worth hearing -- an answer,
# not a list of page titles.
phrases = ["search for {question}", "look up {question}", "google {question}", "find out {question}"]
answers = true

[commands.current_time]
phrases = ["what time is it", "what is the time", "tell me the time", "the time please"]
# Answers rather than reports: "how long until noon" needs the time to answer,
# it is not a request to be told the time.
answers = true

[commands.status]
phrases = ["status", "give me a status report", "how are things"]

[commands.help]
phrases = ["what can i say", "list my commands", "help me", "what are my commands"]

[commands.reload_commands]
phrases = ["reload my commands", "reload the commands"]

# ----------------------------------------------------------------- music ----

# Searching YouTube Music, then playing what you pick.
#
# Song and artist names are what speech recognition is worst at -- they are not
# sentences in any language, and the model was not trained on them. So the name
# is typed: say "play a song" on its own, the typing box opens, type the name
# and press Enter. The results are read back one at a time; say a number to
# play one.
#
# Saying the name outright still works, for a title that is easy to hear.
#
# Nothing here starts with "search for" or "find": those already belong to the
# web search, and "search for the song X" would match both -- at which point
# MikkiLens says the command is ambiguous and does nothing.
[commands.search_music]
phrases = ["play a song", "play the song {query}", "play some {query}", "put on {query}"]

# Picking one of the results just read out. The number is the one you heard,
# and 1 to 5 can be pressed in the typing box instead.
[commands.play_song]
phrases = ["play number {number}", "pick number {number}", "choose number {number}"]

[commands.list_songs]
phrases = ["read the songs again", "list those songs again", "what were the songs"]

# Controlling the song that is playing. This is the part a browser could never
# do: "stop the music" has nowhere to go when the song is somebody else's tab.
[commands.stop_music]
phrases = ["stop the music", "turn the music off"]

[commands.pause_music]
phrases = ["pause the music", "hold the music"]

[commands.resume_music]
phrases = ["resume the music", "start the music again"]

[commands.now_playing]
phrases = ["what song is this", "what is playing"]
