# Build the installer and leave it as a draft release.
#
# The last step is deliberately not automatic. electron-builder uploads to a
# GitHub release that stays a *draft*, so nothing is visible to anyone until
# somebody presses Publish. A build that went wrong is deleted with no one
# having downloaded it, and the moment a release does go out is a decision
# rather than a side effect of pushing.
#
# Two ways to start it:
#
#   Actions -> Build the installer -> Run workflow
#       builds whatever is on the branch, at the version already in
#       package.json.
#
#   git tag v0.3.0 && git push origin v0.3.0
#       builds that version. The tag wins: package.json is rewritten to match
#       it inside the runner, so the tag, the installer filename and the
#       release all agree without anyone having to remember to bump a file.
#
# Either way the finished installer is also attached to the run itself as an
# artifact, so it can be downloaded and tested without publishing anything.
#
# This is also the only workflow that sees the Google OAuth client. Two
# repository secrets, under Settings -> Secrets and variables -> Actions:
#
#   GOOGLE_OAUTH_CLIENT_ID       the desktop client id from Google Cloud
#   GOOGLE_OAUTH_CLIENT_SECRET   its secret
#
# They are read by the two steps below and nowhere else, sealed into the engine
# at link time, and never printed -- one step checks only that they are there,
# the other builds. The quick checks in ci.yml do not get them and do not need
# them:
# nothing there builds an installer, and a pull request from a fork cannot read
# a secret anyway. With the secrets absent the build still succeeds and simply
# ships without a built-in sign-in.
#
# To rotate: add a second secret to the same client in Google Cloud, update
# GOOGLE_OAUTH_CLIENT_SECRET here, cut a release, and delete the old secret
# once people have had time to update. Both secrets are live during that
# window, which is what keeps installs still on the old build working.
#
# Existing sign-ins survive a rotation: a refresh token is bound to the client
# id and the person, not to the secret. Deleting the OAuth client itself is the
# thing that signs everyone out at once, which is why the credential is kept
# out of the source tree at all -- see packages/controllers/youtube/clientsecret.go.

name: Build the installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Creating the draft release and uploading to it is a write to the repository.
permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # go-version-file keeps this honest: the toolchain follows go.mod rather
      # than a number here that nobody remembers to update.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The wake word binds ONNX Runtime through cgo, so the build needs a C
      # compiler. The Windows runners ship one; this fails early and clearly if
      # that ever stops being true, rather than deep inside `go build`.
      - name: Check the C toolchain
        run: gcc --version

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          Write-Host "Building version $version"
          npm version $version --no-git-tag-version --allow-same-version --workspaces --include-workspace-root

      - name: Install dependencies
        run: npm ci

      # The ONNX runtime and the two shared wake models, which go inside the
      # installer. Cached because they are pinned: the key changes only when
      # the script that pins them does.
      - name: Cache the wake word files
        uses: actions/cache@v4
        with:
          path: data/models
          key: wake-${{ runner.os }}-${{ hashFiles('scripts/fetch-wake.mjs') }}

      - name: Fetch the wake word files
        run: npm run fetch:wake

      # Electron and electron-builder's own tooling, which is otherwise
      # re-downloaded on every run.
      - name: Cache the Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Checks before the build, not after: an installer that was going to be
      # published anyway is the wrong place to find out the tests fail. The
      # wake word tests run for real here, because the files above are in place
      # by now; the speech tests skip themselves, the models being far too
      # large to fetch on every build.
      - name: Check formatting
        run: |
          $unformatted = gofmt -l apps packages
          if ($unformatted) {
            Write-Host "These files need gofmt:"
            $unformatted | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test the engine
        run: go test ./...
        env:
          MIKKILENS_SILENT: '1'

      - name: Test the window
        run: npm run test:desktop

      # Said before the build rather than after, because "the installer has no
      # sign-in in it" is a thing to learn now and not from her, on stream.
      # The values are never printed -- only whether they are there.
      - name: Check the YouTube sign-in credential
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          $id = "$env:GOOGLE_OAUTH_CLIENT_ID"
          $secret = "$env:GOOGLE_OAUTH_CLIENT_SECRET"
          if ($id -and $secret) {
            Write-Host "The installer will carry a built-in YouTube sign-in."
          } elseif ($id -or $secret) {
            Write-Host "::error::Only one of GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET is set. Half a credential builds a Connect button that dies at Google's consent screen."
            exit 1
          } else {
            Write-Host "::warning::No OAuth client in the repository secrets, so this installer ships without a built-in YouTube sign-in. Anyone installing it will need their own data/client_secret.json to press Connect. Add GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET under Settings -> Secrets and variables -> Actions."
          }

      # Builds the engine, packages the app, and uploads to a draft release.
      # GH_TOKEN is what electron-builder looks for; the publish target is the
      # github provider already declared in apps/desktop/package.json.
      #
      # The two Google secrets are read here and nowhere else. scripts/build-daemon.mjs
      # seals them into the engine at link time (packages/core/secret), so
      # neither value reaches the log, the source tree, or a `strings` dump of
      # the shipped executable. Absent, the build simply carries no credential.
      - name: Build and draft the release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      # Also kept on the run itself, so a build can be downloaded and tried
      # without touching releases at all.
      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: MikkiLens-installer
          path: |
            dist/app/MikkiLens-Setup-*.exe
            dist/app/MikkiLens.exe
          if-no-files-found: error
          retention-days: 30

      - name: Say where it went
        run: |
          Write-Host ""
          Write-Host "The installer is built."
          Write-Host "Open Releases, check the draft, and press Publish when it looks right:"
          Write-Host "  https://github.com/${{ github.repository }}/releases"
